name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests and build EXE
        shell: powershell
        run: .\build.ps1

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: mouse-gesture-actions-${{ github.sha }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
