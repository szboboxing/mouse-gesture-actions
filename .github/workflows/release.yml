name: Publish Release

on:
  push:
    tags:
      - "V*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 与本地验证环境一致（Python 3.11），产物体积更小（约 9MB，
          # 3.13 运行时会大 ~4MB）；内网离线工具，3.11 完全够用。
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify tag matches source version
        shell: powershell
        run: |
          $ExpectedTag = (python -c "from version import VERSION_TAG; print(VERSION_TAG)").Trim()
          if ($env:GITHUB_REF_NAME -ne $ExpectedTag) {
              throw "Tag $env:GITHUB_REF_NAME does not match source version $ExpectedTag"
          }

      - name: Run tests and build EXE
        shell: powershell
        run: .\build.ps1

      - name: Prepare release assets
        shell: powershell
        run: |
          $BuiltExe = Get-ChildItem dist -Filter "*.exe" |
              Where-Object { $_.Name -notlike "mouse-gesture-actions-*" } |
              Select-Object -First 1
          if (-not $BuiltExe) {
              throw "Built EXE was not found"
          }

          $ReleaseName = "mouse-gesture-actions-$env:GITHUB_REF_NAME.exe"
          $ReleasePath = Join-Path "dist" $ReleaseName
          Copy-Item $BuiltExe.FullName $ReleasePath

          $Hash = Get-FileHash $ReleasePath -Algorithm SHA256
          "$($Hash.Hash)  $ReleaseName" |
              Set-Content dist\SHA256.txt -Encoding ASCII

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 鼠标手势动作小工具 ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            dist/mouse-gesture-actions-*.exe
            dist/SHA256.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
